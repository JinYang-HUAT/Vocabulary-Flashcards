<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="词汇闪卡">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>词汇闪卡 Vocabulary Flashcards</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --fg:#e2e8f0; --muted:#94a3b8;
    --accent:#38bdf8; --accent2:#22c55e; --danger:#f87171;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 600px at 50% -10%, #1e3a5f 0%, var(--bg) 60%);
    color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    padding: calc(8px + var(--safe-top)) 12px calc(8px + var(--safe-bottom));
    user-select:none;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 10px}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px;color:var(--muted)}
  .counter{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 0 10px}
  button{
    font:inherit;color:var(--fg);background:var(--card2);border:1px solid #334155;
    border-radius:12px;padding:9px 14px;cursor:pointer;transition:.15s;
  }
  button:active{transform:scale(.96)}
  button.primary{background:linear-gradient(135deg,#0284c7,#38bdf8);border-color:transparent;color:#04121f;font-weight:700}
  button.ghost{background:transparent}
  button:disabled{opacity:.4;cursor:default}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  .scene{width:100%;max-width:520px;height:100%;max-height:70dvh;perspective:1400px;position:relative}
  .card{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.22,.8,.28,1);
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:linear-gradient(160deg,var(--card),#16202f);
    border:1px solid #334155;border-radius:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:18px;gap:12px;overflow:hidden;
    box-shadow:0 18px 40px -18px rgba(0,0,0,.8);
  }
  .face.back{transform:rotateY(180deg)}
  .imgbox{
    flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;
    border-radius:14px;background:#0b1220;position:relative;overflow:hidden;
  }
  .imgbox img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .35s}
  .imgbox img.loaded{opacity:1}
  .spinner{
    position:absolute;width:36px;height:36px;border-radius:50%;
    border:3px solid #334155;border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{position:absolute;bottom:10px;font-size:12px;color:var(--muted)}
  .word{font-size:clamp(20px,5.5vw,30px);font-weight:700;text-align:center;line-height:1.25;word-break:break-word}
  .phonetic{font-size:16px;color:var(--accent);text-align:center}
  .pos{font-size:13px;color:var(--accent2);font-weight:600}
  .meaning{font-size:clamp(15px,4vw,19px);text-align:center;line-height:1.6;color:var(--fg)}
  .back .word{font-size:clamp(18px,4.5vw,24px)}
  .speak-row{display:flex;gap:10px}
  .speak{
    display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:9px 16px;
    background:linear-gradient(135deg,#0ea5e9,#22d3ee);border:none;color:#04121f;font-weight:700;
  }
  .speak.speaking{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(56,189,248,.5)}50%{box-shadow:0 0 0 12px rgba(56,189,248,0)}}
  .hint{font-size:11px;color:#64748b;text-align:center;padding:8px 0 0;line-height:1.6}
  kbd{background:#1e293b;border:1px solid #334155;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit}
  .toast{
    position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));transform:translate(-50%,20px);
    background:#7f1d1d;color:#fecaca;padding:10px 18px;border-radius:12px;font-size:13px;
    opacity:0;pointer-events:none;transition:.3s;max-width:90vw;text-align:center;z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .progress{height:3px;background:#1e293b;border-radius:99px;overflow:hidden;margin:0 4px 8px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0284c7,#22d3ee);transition:width .3s}
  .offline-badge{
    position:fixed;top:calc(8px + var(--safe-top));right:10px;z-index:50;
    background:#78350f;color:#fde68a;font-size:11px;padding:4px 10px;border-radius:999px;display:none;
  }
  .offline-badge.show{display:block}
</style>
</head>
<body>
<div class="offline-badge" id="offlineBadge">离线模式</div>

<header>
  <h1>词汇闪卡</h1>
  <div class="counter" id="counter">1 / 15</div>
</header>

<div class="progress"><i id="progressBar"></i></div>

<div class="stage">
  <div class="scene">
    <div class="card" id="card">
      <!-- 正面 -->
      <div class="face front">
        <div class="imgbox" id="imgboxFront">
          <div class="spinner" id="spinnerFront"></div>
          <img id="imgFront" alt="flashcard image">
          <div class="loading-text" id="loadTextFront">加载中…</div>
        </div>
        <div class="word" id="wordFront">—</div>
        <div class="speak-row">
          <button class="speak" id="speakFront" aria-label="播放发音">🔊 发音</button>
        </div>
      </div>
      <!-- 反面 -->
      <div class="face back">
        <div class="word" id="wordBack">—</div>
        <div class="phonetic" id="phoneticBack"></div>
        <div class="pos" id="posBack"></div>
        <div class="meaning" id="meaningBack"></div>
        <div class="speak-row">
          <button class="speak" id="speakBack" aria-label="播放发音">🔊 发音</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toolbar">
  <button id="prevBtn" class="ghost">◀ 上一张</button>
  <button id="flipBtn" class="primary">翻转</button>
  <button id="nextBtn" class="ghost">下一张 ▶</button>
</div>
<div class="toolbar" style="padding-top:0">
  <button id="orderBtn" class="ghost">顺序播放</button>
  <button id="shuffleBtn" class="ghost">随机打乱</button>
  <button id="resetBtn" class="ghost">重新开始</button>
</div>

<div class="hint">
  <kbd>Enter</kbd> 发音 &nbsp;·&nbsp; <kbd>PgUp</kbd>/<kbd>PgDn</kbd> 切换闪卡 &nbsp;·&nbsp; 点击卡片翻转
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 数据 ============ */
const IMG_BASE = "https://cdn.jsdelivr.net/gh/JinYang-HUAT/Vocabulary-Flashcards@main/images/";

/* 文件名 → 音标 / 词性 / 释义 */
const WORDS = [
  {
    file: "file",
    phonetic: "/faɪl/",
    pos: "n. / v.",
    meaning: "n. 文件；档案；文件夹  v. 归档；提交；锉平"
  },
  {
    file: "boss",
    phonetic: "/bɒs/ (英) /bɔːs/ (美)",
    pos: "n. / v.",
    meaning: "n. 老板；上司；头儿  v. 指挥；支配"
  },
  {
    file: "considerably",
    phonetic: "/kənˈsɪdərəbli/",
    pos: "adv.",
    meaning: "相当大地；在很大程度上；非常"
  },
  {
    file: "autoignition",
    phonetic: "/ˌɔːtəʊɪɡˈnɪʃn/",
    pos: "n.",
    meaning: "自燃；自动点火（内燃机中混合气自行着火）"
  },
  {
    file: "detect",
    phonetic: "/dɪˈtekt/",
    pos: "v.",
    meaning: "察觉；发现；探测；检测"
  },
  {
    file: "abnormal in the sense of 正常人",
    phonetic: "/æbˈnɔːml/",
    pos: "adj.",
    meaning: "异常的；不正常的。此处短语意为“相对于正常人意义上的异常”"
  },
  {
    file: "normal",
    phonetic: "/ˈnɔːml/",
    pos: "adj. / n.",
    meaning: "adj. 正常的；标准的；普通的  n. 正常状态；常态"
  },
  {
    file: "abnormal",
    phonetic: "/æbˈnɔːml/",
    pos: "adj.",
    meaning: "异常的；不正常的；变态的"
  },
  {
    file: "leaded",
    phonetic: "/ˈledɪd/",
    pos: "adj.",
    meaning: "含铅的（尤指含铅汽油）；加铅的"
  },
  {
    file: "unleaded",
    phonetic: "/ʌnˈledɪd/",
    pos: "adj. / n.",
    meaning: "adj. 无铅的（汽油）  n. 无铅汽油"
  },
  {
    file: "lead as a leader",
    phonetic: "/liːd/",
    pos: "v. / n.",
    meaning: "作“领导”义的 lead：v. 领导；带领；引导  n. 领导地位；领头。短语意为“作为领导者的 lead”"
  },
  {
    file: "detect",
    phonetic: "/dɪˈtekt/",
    pos: "v.",
    meaning: "察觉；发现；探测；检测（列表中出现两次，保留重复项）"
  },
  {
    file: "unleaded-",
    phonetic: "/ʌnˈledɪd/",
    pos: "adj. / n.",
    meaning: "同 unleaded：无铅的；无铅汽油（文件名末尾带连字符）"
  },
  {
    file: "diesel",
    phonetic: "/ˈdiːzl/",
    pos: "n.",
    meaning: "柴油；柴油发动机；柴油车"
  }
];

/* 说明：你列表共 15 项，其中 "abnormal in the sense of 正常人" 计 1 项，
   "detect" 出现两次均保留。若需去重/剔除，改 WORDS 数组即可。 */

/* ============ 状态 ============ */
let order = WORDS.map((_, i) => i);   // 当前播放顺序（索引数组）
let cursor = 0;                        // 当前在第几个
let flipped = false;
let speakLang = "en-US";

const $ = id => document.getElementById(id);
const card = $("card");
const imgFront = $("imgFront");
const spinnerFront = $("spinnerFront");
const loadTextFront = $("loadTextFront");

/* ============ 工具 ============ */
function imgUrl(file){
  return IMG_BASE + encodeURIComponent(file);
}
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove("show"), 2600);
}
function updateCounter(){
  $("counter").textContent = `${cursor + 1} / ${order.length}`;
  $("progressBar").style.width = `${((cursor + 1) / order.length) * 100}%`;
}

/* ============ 发音 ============ */
let voices = [];
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  // 优先美音/英音
  voices.sort((a,b) => {
    const score = v => (v.lang === "en-US" ? 0 : v.lang === "en-GB" ? 1 : 2);
    return score(a) - score(b);
  });
}
if ("speechSynthesis" in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, btn){
  if (!("speechSynthesis" in window)){ toast("此浏览器不支持语音合成"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = speakLang;
  u.rate = 0.92;
  u.pitch = 1;
  if (voices.length) u.voice = voices[0];
  if (btn){
    btn.classList.add("speaking");
    u.onend = u.onerror = () => btn.classList.remove("speaking");
  }
  speechSynthesis.speak(u);
}
function speakCurrent(){
  const item = WORDS[order[cursor]];
  // 正面读文件名原词；反面也读原词（发音相同），避免把中文读进去
  // 对含中文的长文件名，只读英文部分
  let text = item.file.replace(/[^\x00-\x7F]+/g, " ").replace(/\s+/g, " ").trim();
  if (!text) text = item.file;
  speak(text, flipped ? $("speakBack") : $("speakFront"));
}

/* ============ 渲染 ============ */
function render(){
  const item = WORDS[order[cursor]];
  const url = imgUrl(item.file);

  // 正面
  $("wordFront").textContent = item.file;
  // 反面
  $("wordBack").textContent = item.file;
  $("phoneticBack").textContent = item.phonetic;
  $("posBack").textContent = item.pos;
  $("meaningBack").textContent = item.meaning;

  // 图片加载
  spinnerFront.style.display = "block";
  loadTextFront.style.display = "block";
  loadTextFront.textContent = "加载中…";
  imgFront.classList.remove("loaded");
  imgFront.onload = () => {
    spinnerFront.style.display = "none";
    loadTextFront.style.display = "none";
    imgFront.classList.add("loaded");
  };
  imgFront.onerror = () => {
    spinnerFront.style.display = "none";
    loadTextFront.style.display = "block";
    loadTextFront.textContent = "图片加载失败，点此重试";
    loadTextFront.style.cursor = "pointer";
    loadTextFront.onclick = () => {
      imgFront.src = "";
      setTimeout(() => { imgFront.src = url + "?r=" + Date.now(); }, 50);
      loadTextFront.textContent = "重试中…";
    };
  };
  imgFront.src = url;
  imgFront.alt = item.file;

  // 翻转复位
  flipped = false;
  card.classList.remove("flipped");
  updateCounter();
  preloadNeighbors();
}

/* ============ 预加载 ============ */
const preloaded = new Set();
function preloadOne(file){
  if (preloaded.has(file)) return;
  preloaded.add(file);
  const im = new Image();
  im.src = imgUrl(file);
}
function preloadNeighbors(){
  for (let d = -2; d <= 2; d++){
    const i = cursor + d;
    if (i >= 0 && i < order.length) preloadOne(WORDS[order[i]].file);
  }
}
function preloadAll(){
  // 网络空闲时逐步预加载全部
  let i = 0;
  const step = () => {
    if (i >= order.length) return;
    preloadOne(WORDS[order[i]].file);
    i++;
    setTimeout(step, 300);
  };
  if ("requestIdleCallback" in window) requestIdleCallback(step);
  else setTimeout(step, 1000);
}

/* ============ 交互 ============ */
function flip(){
  flipped = !flipped;
  card.classList.toggle("flipped", flipped);
}
function go(delta){
  if (!order.length) return;
  cursor = (cursor + delta + order.length) % order.length;
  render();
}
function shuffle(){
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  cursor = 0;
  render();
  $("orderBtn").disabled = false;
  $("orderBtn").textContent = "顺序播放";
  toast("已随机打乱");
}
function resetOrder(){
  order = WORDS.map((_, i) => i);
  cursor = 0;
  render();
  $("orderBtn").disabled = true;
  $("orderBtn").textContent = "当前：顺序";
  toast("已恢复顺序");
}

card.addEventListener("click", e => {
  if (e.target.closest("button")) return;
  flip();
});
$("flipBtn").addEventListener("click", flip);
$("prevBtn").addEventListener("click", () => go(-1));
$("nextBtn").addEventListener("click", () => go(1));
$("shuffleBtn").addEventListener("click", shuffle);
$("resetBtn").addEventListener("click", resetOrder);
$("orderBtn").addEventListener("click", resetOrder);

$("speakFront").addEventListener("click", e => {
  e.stopPropagation();
  const item = WORDS[order[cursor]];
  speak(item.file.replace(/[^\x00-\x7F]+/g, " ").trim() || item.file, e.currentTarget);
});
$("speakBack").addEventListener("click", e => {
  e.stopPropagation();
  const item = WORDS[order[cursor]];
  speak(item.file.replace(/[^\x00-\x7F]+/g, " ").trim() || item.file, e.currentTarget);
});

/* 键盘 */
document.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    e.preventDefault();
    speakCurrent();
  } else if (e.key === "PageUp"){
    e.preventDefault();
    go(-1);
  } else if (e.key === "PageDown"){
    e.preventDefault();
    go(1);
  } else if (e.key === " "){
    e.preventDefault();
    flip();
  }
});

/* 滑动切换（移动端） */
let touchX = null, touchY = null;
card.addEventListener("touchstart", e => {
  if (e.touches.length === 1){
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }
}, {passive:true});
card.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  touchX = touchY = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
    go(dx < 0 ? 1 : -1);
  }
}, {passive:true});

/* ============ 离线提示 ============ */
function updateOnline(){
  $("offlineBadge").classList.toggle("show", !navigator.onLine);
}
window.addEventListener("online", updateOnline);
window.addEventListener("offline", updateOnline);
updateOnline();

/* ============ PWA ============ */
if ("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(err => {
      console.warn("SW 注册失败：", err);
    });
  });
}

/* ============ 启动 ============ */
$("orderBtn").disabled = true;
$("orderBtn").textContent = "当前：顺序";
render();
setTimeout(preloadAll, 2500);
</script>
</body>
</html>
