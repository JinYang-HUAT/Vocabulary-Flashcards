<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Flashcards</title>
<link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.4rem; margin: 8px 0 4px; font-weight: 600; letter-spacing: .5px; }
  .subtitle { font-size: .85rem; color: #94a3b8; margin-bottom: 10px; text-align: center; }
  
  .group-select {
    margin-bottom: 15px; padding: 8px 16px; border-radius: 8px;
    background: #334155; color: #e2e8f0; border: 1px solid #475569;
    font-size: 1rem; outline: none; cursor: pointer;
  }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    margin-bottom: 18px;
  }
  button {
    cursor: pointer; border: none; border-radius: 10px;
    padding: 9px 16px; font-size: .9rem; font-weight: 600;
    background: #334155; color: #e2e8f0; transition: .2s;
  }
  button:hover { background: #475569; }
  button.primary { background: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .counter { font-size: .85rem; color: #94a3b8; align-self: center; margin: 0 6px; }

  .card-scene {
    width: min(92vw, 560px);
    height: min(70vh, 600px);
    perspective: 1400px;
    margin-bottom: 18px;
  }
  .card {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4,.2,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 18px;
    background: #f8fafc; color: #0f172a;
    box-shadow: 0 18px 45px rgba(0,0,0,.45);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; overflow: hidden;
  }
  .face.back { transform: rotateY(180deg); background: #eef2ff; }

  .front-img {
    max-width: 100%; max-height: 65%;
    object-fit: contain; border-radius: 10px;
    opacity: 0; transition: opacity 0.3s ease-in-out;
  }
  .front-img.loaded { opacity: 1; }
  
  .front-word {
    margin-top: 15px; font-size: 1.8rem; font-weight: 800; color: #1e293b;
    text-align: center; word-break: break-word;
  }
  .hint { position: absolute; bottom: 12px; font-size: .75rem; color: #94a3b8; }

  .speak-btn {
    margin-top: 15px; background: #2563eb; color: #fff;
    padding: 8px 22px; border-radius: 999px; font-size: .9rem;
    display: flex; align-items: center; gap: 6px;
  }
  .speak-btn:hover { background: #1d4ed8; }

  .back-word { font-size: 1.5rem; font-weight: 800; color: #1e3a8a; text-align: center; word-break: break-word; }
  .phonetic { margin: 8px 0 4px; font-size: 1.05rem; color: #475569; font-family: "Times New Roman", serif; }
  .pos-def { margin-top: 15px; font-size: 1rem; line-height: 1.6; text-align: left; width: 100%; max-height: 50%; overflow-y: auto; padding: 0 8px; }
  .pos-def .pos { color: #b45309; font-weight: 700; font-style: italic; }

  .no-img {
    width: 100%; height: 65%; display: flex; align-items: center; justify-content: center;
    color: #94a3b8; font-size: .95rem; border: 2px dashed #cbd5e1; border-radius: 10px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
</style>
</head>
<body>

<h1>Vocabulary Flashcards</h1>
<div class="subtitle">按 Enter 发音 · PgUp/PgDn 切换 · 空格翻面</div>

<select id="groupSelect" class="group-select">
  <option value="">加载中...</option>
</select>

<div class="toolbar">
  <button id="prevBtn" class="primary">← 上一个 (PgUp)</button>
  <button id="flipBtn" class="primary">→ 翻面 (空格)</button>
  <button id="nextBtn" class="primary">下一个 → (PgDn)</button>
  <button id="orderBtn">顺序播放</button>
  <button id="shuffleBtn">随机打乱</button>
  <span class="counter" id="counter"></span>
</div>

<div class="card-scene">
  <div class="card" id="card">
    <div class="face front">
      <div id="imgContainer" style="width:100%; height:65%; display:flex; align-items:center; justify-content:center; position:relative;">
        <img id="frontImg" class="front-img" alt="">
        <div id="loadingText" class="no-img" style="display:none; position:absolute; inset:0;">图片加载中…</div>
      </div>
      <div class="front-word" id="frontWord"></div>
      <button class="speak-btn" id="speakBtnFront">🔊 发音 (Enter)</button>
      <div class="hint">点击卡片查看释义</div>
    </div>
    <div class="face back">
      <div class="back-word" id="backWord"></div>
      <div class="phonetic" id="phonetic"></div>
      <div class="pos-def" id="posDef"></div>
      <button class="speak-btn" id="speakBtnBack">🔊 发音 (Enter)</button>
      <div class="hint">点击卡片返回图片</div>
    </div>
  </div>
</div>

<script>
/* ============ 核心配置区 ============ */
const CDN_BASE = "https://cdn.jsdelivr.net/gh/JinYang-HUAT/Vocabulary-Flashcards@main/";
const IMG_BASE = CDN_BASE + "images/";
const IMG_EXTS = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif", ".bmp"];

/* ============ 词汇数据包（无需 txt，直接内置） ============ */
const DATA_A_E = [
  { word: "admiral", ipa: "/ˈædmərəl/", pos: "n.", def: "海军上将；舰队司令" },
  { word: "adulterate", ipa: "/əˈdʌltəreɪt/", pos: "v.", def: "掺假；掺杂" },
  { word: "antibiotic", ipa: "/ˌæntibaɪˈɒtɪk/", pos: "n./adj.", def: "抗生素；抗生素的" },
  { word: "antimicrobial", ipa: "/ˌæntimaɪˈkrəʊbiəl/", pos: "adj./n.", def: "抗微生物的；抗微生物剂" },
  { word: "atrocity", ipa: "/əˈtrɒsəti/", pos: "n.", def: "暴行；残忍" },
  { word: "avert", ipa: "/əˈvɜːt/", pos: "v.", def: "避免；防止；转移" },
  { word: "cemetery", ipa: "/ˈsemətri/", pos: "n.", def: "墓地；公墓" },
  { word: "chivalry", ipa: "/ˈʃɪvəlri/", pos: "n.", def: "骑士精神；侠义" },
  { word: "compliant", ipa: "/kəmˈplaɪənt/", pos: "adj.", def: "顺从的；符合规定的" },
  { word: "comply", ipa: "/kəmˈplaɪ/", pos: "v.", def: "遵守；服从" },
  { word: "contravene", ipa: "/ˌkɒntrəˈviːn/", pos: "v.", def: "违反；违犯" },
  { word: "courtly", ipa: "/ˈkɔːtli/", pos: "adj.", def: "宫廷的；彬彬有礼的" },
  { word: "crumble", ipa: "/ˈkrʌmbl/", pos: "v.", def: "弄碎；崩溃；瓦解" },
  { word: "crumple", ipa: "/ˈkrʌmpl/", pos: "v.", def: "弄皱；压皱" },
  { word: "crux", ipa: "/krʌks/", pos: "n.", def: "关键；症结" },
  { word: "debris", ipa: "/ˈdebriː/", pos: "n.", def: "碎片；残骸；瓦砾" },
  { word: "emirate", ipa: "/ˈemɪrət/", pos: "n.", def: "酋长国" },
  { word: "empirical", ipa: "/ɪmˈpɪrɪkl/", pos: "adj.", def: "经验主义的" },
  { word: "eventuality", ipa: "/ɪˌventʃuˈæləti/", pos: "n.", def: "可能发生的事" },
  { word: "extravagant", ipa: "/ɪkˈstrævəɡənt/", pos: "adj.", def: "奢侈的；过度的" },
  { word: "extravaganza", ipa: "/ɪkˌstrævəˈɡænzə/", pos: "n.", def: "盛大演出" }
];

const DATA_F_P = [
  { word: "fester", ipa: "/ˈfestə(r)/", pos: "v.", def: "化脓；溃烂" },
  { word: "footage", ipa: "/ˈfʊtɪdʒ/", pos: "n.", def: "影片片段" },
  { word: "glitz", ipa: "/ɡlɪts/", pos: "n.", def: "浮华；耀眼的光彩" },
  { word: "haphazard", ipa: "/ˌhæpˈhæzəd/", pos: "adj.", def: "随意的；杂乱的" },
  { word: "incentive", ipa: "/ɪnˈsentɪv/", pos: "n.", def: "激励；刺激；诱因" },
  { word: "infiltrate", ipa: "/ˈɪnfɪltreɪt/", pos: "v.", def: "潜入；渗透" },
  { word: "inquiry", ipa: "/ɪnˈkwaɪəri/", pos: "n.", def: "询问；调查" },
  { word: "Israel", ipa: "/ˈɪzreɪl/", pos: "n.", def: "以色列" },
  { word: "Israeli", ipa: "/ɪzˈreɪli/", pos: "adj./n.", def: "以色列的；以色列人" },
  { word: "Jerusalem", ipa: "/dʒəˈruːsələm/", pos: "n.", def: "耶路撒冷" },
  { word: "jostle", ipa: "/ˈdʒɒsl/", pos: "v.", def: "推挤；碰撞" },
  { word: "legislature", ipa: "/ˈledʒɪsleɪtʃə(r)/", pos: "n.", def: "立法机关" },
  { word: "legitimate", ipa: "/lɪˈdʒɪtɪmət/", pos: "adj.", def: "合法的；正当的" },
  { word: "loggerhead", ipa: "/ˈlɒɡəhed/", pos: "n.", def: "蠢人；赤蠵龟" },
  { word: "maritime", ipa: "/ˈmærɪtaɪm/", pos: "adj.", def: "海事的；沿海的" },
  { word: "mediation", ipa: "/ˌmiːdiˈeɪʃn/", pos: "n.", def: "调解；仲裁" },
  { word: "microbial", ipa: "/maɪˈkrəʊbiəl/", pos: "adj.", def: "微生物的" },
  { word: "militia", ipa: "/məˈlɪʃə/", pos: "n.", def: "民兵；民兵组织" },
  { word: "minaret", ipa: "/ˌmɪnəˈret/", pos: "n.", def: "宣礼塔" },
  { word: "mob", ipa: "/mɒb/", pos: "n./v.", def: "暴民；围攻" },
  { word: "morph", ipa: "/mɔːf/", pos: "v.", def: "变形；改变形态" },
  { word: "narcotic", ipa: "/nɑːˈkɒtɪk/", pos: "n./adj.", def: "麻醉品；麻醉的" },
  { word: "octagonal", ipa: "/ɒkˈtæɡənl/", pos: "adj.", def: "八边形的" },
  { word: "octangonal cup", ipa: "/ɒkˈtæɡənl kʌp/", pos: "n.", def: "八边形杯子" },
  { word: "pickaxe", ipa: "/ˈpɪkæks/", pos: "n.", def: "镐；鹤嘴锄" },
  { word: "pluck", ipa: "/plʌk/", pos: "v./n.", def: "拔；摘；勇气" },
  { word: "preside", ipa: "/prɪˈzaɪd/", pos: "v.", def: "主持；主管" }
];

const DATA_R_W = [
  { word: "ratify", ipa: "/ˈrætɪfaɪ/", pos: "v.", def: "批准；正式签署" },
  { word: "rift", ipa: "/rɪft/", pos: "n.", def: "裂缝；裂痕；分歧" },
  { word: "rubble", ipa: "/ˈrʌbl/", pos: "n.", def: "瓦砾；碎石；废墟" },
  { word: "sabotage", ipa: "/ˈsæbətɑːʒ/", pos: "n./v.", def: "破坏活动；蓄意破坏" },
  { word: "sanitize", ipa: "/ˈsænətaɪz/", pos: "v.", def: "消毒；使清洁" },
  { word: "sanitizer", ipa: "/ˈsænətaɪzə(r)/", pos: "n.", def: "消毒剂；洗手液" },
  { word: "Saudi Arabia", ipa: "/ˌsaʊdi əˈreɪbiə/", pos: "n.", def: "沙特阿拉伯" },
  { word: "smuggle", ipa: "/ˈsmʌɡl/", pos: "v.", def: "走私；偷运" },
  { word: "smuggler", ipa: "/ˈsmʌɡlə(r)/", pos: "n.", def: "走私者" },
  { word: "squeeze_squash_crush", ipa: "/skwiːz skwɒʃ krʌʃ/", pos: "v.", def: "挤压；压扁；压碎" },
  { word: "swathe", ipa: "/sweɪð/", pos: "n./v.", def: "大片区域；包裹" },
  { word: "terms and conditions", ipa: "/tɜːmz ənd kənˈdɪʃnz/", pos: "n.", def: "条款与条件" },
  { word: "United Arab Emirates", ipa: "/juˌnaɪtɪd ˌærəb ˈemɪrəts/", pos: "n.", def: "阿拉伯联合酋长国" },
  { word: "vigilant", ipa: "/ˈvɪdʒɪlənt/", pos: "adj.", def: "警惕的；警觉的" },
  { word: "violate", ipa: "/ˈvaɪəleɪt/", pos: "v.", def: "违反；侵犯" },
  { word: "vociferous", ipa: "/vəˈsɪfərəs/", pos: "adj.", def: "喧嚣的；大声疾呼的" },
  { word: "wreckage", ipa: "/ˈrekɪdʒ/", pos: "n.", def: "残骸；破坏" }
];

/* ============ 系统状态与元素 ============ */
const GROUPS = {
  "a-e": DATA_A_E,
  "f-p": DATA_F_P,
  "r-w": DATA_R_W
};

let deck = []; 
let index = 0;

const groupSelect = document.getElementById("groupSelect");
const cardEl = document.getElementById("card");
const frontImg = document.getElementById("frontImg");
const frontWord = document.getElementById("frontWord");
const backWord = document.getElementById("backWord");
const phoneticEl = document.getElementById("phonetic");
const posDefEl = document.getElementById("posDef");
const counterEl = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const loadingText = document.getElementById("loadingText");

const imageCache = {};

/* ============ 初始化菜单 ============ */
function init() {
  groupSelect.innerHTML = "";
  for (let key in GROUPS) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = key + " 组";
    groupSelect.appendChild(opt);
  }
  loadGroup("a-e");
}

/* ============ 加载分组 ============ */
function loadGroup(groupName) {
  groupSelect.value = groupName;
  deck = [...GROUPS[groupName]];
  index = 0;
  render();
}

/* ============ 智能匹配图片 ============ */
function tryLoadImage(word, onSuccess, onError) {
  let extIndex = 0;
  // 直接拼接 word（保留空格），因为 GitHub 的原始文件名本身就带空格
  const baseUrl = IMG_BASE + word;

  function tryNext() {
    if (extIndex >= IMG_EXTS.length) { onError(); return; }
    const url = baseUrl + IMG_EXTS[extIndex];
    const img = new Image();
    img.onload = () => onSuccess(url, img);
    img.onerror = () => { extIndex++; tryNext(); };
    img.src = url;
  }
  tryNext();
}

/* ============ 渲染界面 ============ */
function render() {
  if (!deck.length) return;
  cardEl.classList.remove("flipped");
  const item = deck[index];
  
  frontWord.textContent = item.word.charAt(0).toUpperCase() + " ...";
  backWord.textContent = item.word;
  phoneticEl.textContent = item.ipa;
  posDefEl.innerHTML = `<span class='pos'>${item.pos}</span> ${item.def}`;

  frontImg.classList.remove("loaded");
  frontImg.style.display = "none";
  loadingText.style.display = "block";
  loadingText.innerHTML = "图片加载中…";

  // 加载图片
  tryLoadImage(item.word, 
    (url, img) => {
      frontImg.src = url;
      frontImg.classList.add("loaded");
      frontImg.style.display = "block";
      loadingText.style.display = "none";
      imageCache[item.word] = img;
    },
    () => {
      frontImg.style.display = "none";
      loadingText.style.display = "block";
      loadingText.innerHTML = "找不到图片<br><span style='font-size:0.8em'>请检查 images 文件夹</span>";
    }
  );

  counterEl.textContent = (index + 1) + " / " + deck.length;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === deck.length - 1;

  // 预加载下一张
  if (index + 1 < deck.length) {
    const nextWord = deck[index + 1].word;
    if (!imageCache[nextWord]) {
      tryLoadImage(nextWord, (u, i) => { imageCache[nextWord] = i; }, () => {});
    }
  }
}

/* ============ 发音 ============ */
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;

function speakCurrent() {
  if (!window.speechSynthesis || !deck.length) return;
  const word = deck[index].word;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  u.rate = 0.9;
  const en = voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
  if (en) u.voice = en;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ============ 交互控制 ============ */
groupSelect.addEventListener("change", (e) => loadGroup(e.target.value));

cardEl.addEventListener("click", (e) => {
  if (e.target.closest("button")) return;
  cardEl.classList.toggle("flipped");
});
document.getElementById("flipBtn").addEventListener("click", () => cardEl.classList.toggle("flipped"));

document.getElementById("speakBtnFront").addEventListener("click", (e) => { e.stopPropagation(); speakCurrent(); });
document.getElementById("speakBtnBack").addEventListener("click", (e) => { e.stopPropagation(); speakCurrent(); });

prevBtn.addEventListener("click", () => { if (index > 0) { index--; render(); } });
nextBtn.addEventListener("click", () => { if (index < deck.length - 1) { index++; render(); } });

document.getElementById("orderBtn").addEventListener("click", () => {
  deck.sort((a,b) => a.word.localeCompare(b.word));
  index = 0; render();
});
document.getElementById("shuffleBtn").addEventListener("click", () => {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  index = 0; render();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "PageUp") { e.preventDefault(); prevBtn.click(); }
  else if (e.key === "PageDown") { e.preventDefault(); nextBtn.click(); }
  else if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); cardEl.classList.toggle("flipped"); }
  else if (e.key === "Enter") { e.preventDefault(); speakCurrent(); }
});

/* ============ 启动与 PWA ============ */
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
